[tool.poetry]
name = "python-starter-repo"
version = "0.1.0"
description = ""
authors = ["Soliton"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
bs4 = "^0.0.2"
scikit-learn = "1.7.2"
requests = "^2.32.5"
types-requests = "^2.32.4.20250913"
coverage = "^7.13.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
black = "^24.3.0"
mypy = "^1.5.1"
ni-python-styleguide = "^0.4.7"
setuptools = "^80.9.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -------------------------
# Black (formatter)
# -------------------------
[tool.black]
line-length = 100
target-version = ["py310"]

# -------------------------
# NI Python Style Guide
# Google docstrings WITHOUT types
# -------------------------
[tool.ni_python_styleguide]
docstring_style = "google"
type_hints_in_docstring = false
