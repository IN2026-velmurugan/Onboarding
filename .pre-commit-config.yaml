repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ni-python-styleguide-lint
        name: NI Python Styleguide Lint (nps lint)
        entry: poetry run ni-python-styleguide lint
        language: system
        types: [python]
        pass_filenames: false

      - id: ni-python-styleguide-fix
        name: NI Python Styleguide Fix (nps fix)
        entry: poetry run ni-python-styleguide fix
        language: system
        types: [python]
        pass_filenames: false
