# This workflow will install Python dependencies, run tests and lint with in multiple versions of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python CI Pipeline - Checking Code and Test Cases

on:
  # this workflow gets triggered when any pull request is created to the mentioned branches
  pull_request:
  # this workflow gets triggered when manually made to run from action tab
  workflow_dispatch:

jobs:
  running-test-cases:

    strategy:
      matrix:
        os: [windows-latest]
        python-version: ["3.10.x", "3.11.x", "3.12.x"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
    # Checkout the repository to the runner
    - name: Checkout code
      uses: actions/checkout@v3

    # Set up the python environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        pip install poetry
        poetry install --no-root
      shell: bash

    - name: Install Poetry
      run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install project dependencies (including dev)
      run: |
          poetry --version
          # install project deps + dev deps
          poetry install --no-interaction --no-ansi
      shell: bash

      -name: Run Linters (Black + MyPy)
      run: bash .github/workflows/run_python_linter.sh
      shell: bash

      -name: Run Test Cases and Coverage (PyTest)
      run: bash .github/workflows/run_python_pytest.sh
      shell: bash
