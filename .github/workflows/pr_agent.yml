on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pr_reviewer.extra_instructions: ${{ vars.PYTHON__PR_REVIEWER__EXTRA_INSTRUCTIONS }}
          # Maximum number of comments to report in a PR
          pr_reviewer.num_max_findings: 30
          # Disable providing descriptions for PRs
          github_action_config.auto_describe: "false"
          # Disable providing suggestions for PRs
          github_action_config.auto_improve: ${{ vars.PYTHON__GITHUB_ACTION_CONFIG__AUTO_IMPROVE }}
          config.max_model_tokens: 64000
          config.model: ${{ vars.CONFIG__MODEL }}
          # Dedicated reasoning model for self-reflection
          config.model_reasoning: ${{ vars.CONFIG__MODEL_REASONING }}
